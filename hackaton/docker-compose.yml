version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:3001
      - VITE_SOCKET_URL=http://backend:3001
    depends_on:
      - backend
    networks:
      - wikilive-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MOCK_API_URL=http://mock-api:3002
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - mock-api
    networks:
      - wikilive-network

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3002:3002'
    volumes:
      - ./mock-api:/app/mock-api
      - /app/mock-api/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3002
    networks:
      - wikilive-network

networks:
  wikilive-network:
    driver: bridge
