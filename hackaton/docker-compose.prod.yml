version: '3.8'

services:
  # Production WikiLive
  wikilive:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - \"3000:3000\"
      - \"3001:3001\"
      - \"3002:3002\"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VITE_API_URL=http://localhost:3001
      - VITE_SOCKET_URL=http://localhost:3001
    restart: unless-stopped
    healthcheck:
      test: [\"CMD\", \"wget\", \"--spider\", \"-q\", \"http://localhost:3000\"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wikilive-network

networks:
  wikilive-network:
    driver: bridge
